name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Every target builds on a runner of its own architecture. PAR::Packer
        # embeds a native perl interpreter, so ExifTool cannot be cross-packed,
        # and linuxdeploy cannot cross-build ARM AppImages either.
        include:
          - platform: 'macos-latest'
            family: 'mac'
            arch: 'arm64'
          # macos-15-intel is the last x86_64 image GitHub offers and it goes
          # away in August 2027.
          - platform: 'macos-15-intel'
            family: 'mac'
            arch: 'x64'
          - platform: 'ubuntu-24.04'
            family: 'linux'
            arch: 'x64'
          - platform: 'ubuntu-24.04-arm'
            family: 'linux'
            arch: 'arm64'
          - platform: 'windows-latest'
            family: 'win'
            arch: 'x64'

    name: ${{ matrix.family }}-${{ matrix.arch }}
    runs-on: ${{ matrix.platform }}

    env:
      BUNDLE_DIR: src-tauri/target/release/bundle

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable

      - name: Install system dependencies (Linux)
        if: matrix.family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm \
            libpar-packer-perl

      # A bare CPAN client fails to configure PAR::Packer, so bootstrap cpanm.
      - name: Install PAR::Packer (macOS)
        if: matrix.family == 'mac'
        run: |
          curl -fsSL https://cpanmin.us -o /tmp/cpanm
          chmod +x /tmp/cpanm
          /tmp/cpanm -n -l "$HOME/perl5" PAR::Packer
          echo "$HOME/perl5/bin" >> "$GITHUB_PATH"
          echo "PERL5LIB=$HOME/perl5/lib/perl5" >> "$GITHUB_ENV"

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/registry
          key: ${{ matrix.family }}-${{ matrix.arch }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/git
          key: ${{ matrix.family }}-${{ matrix.arch }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src-tauri/target
          key: ${{ matrix.family }}-${{ matrix.arch }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm install

      - name: Pack ExifTool into a self-contained binary
        if: matrix.family != 'win'
        run: node scripts/pack-exiftool.ts

      # The cache above can restore bundles from an earlier version, which would
      # make the rename step ambiguous.
      - name: Clean stale bundles
        run: |
          node -e "require('fs').rmSync(process.env.BUNDLE_DIR, { recursive: true, force: true })"

      - name: Build the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Rename artifacts
        run: node scripts/rename-artifacts.ts ${{ env.BUNDLE_DIR }} ${{ matrix.family }} ${{ matrix.arch }}

      - name: Generate updater JSON
        run: node scripts/generate-updater-json.ts ${{ env.BUNDLE_DIR }} ${{ matrix.family }} ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ matrix.family }}-${{ matrix.arch }}-artifacts
          path: ${{ env.BUNDLE_DIR }}/*/MetadataZero-*-${{ matrix.family }}-${{ matrix.arch }}.*

      - name: Upload latest.json
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: latest-json-${{ matrix.family }}-${{ matrix.arch }}
          path: ${{ env.BUNDLE_DIR }}/latest.json

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'

      - name: Get ExifTool version
        id: exiftool_version
        run: |
          VERSION=$(node -e "import('./scripts/exiftool-host.ts').then(m => console.log(m.EXIFTOOL_VERSION))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: artifacts

      - name: Combine updater JSON files
        run: node scripts/combine-updater-json.ts

      - name: Create Release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          files: |
            artifacts/*-artifacts/**/*
            artifacts/latest.json
          body: |
            #### Bundled ExifTool version

            This release includes:

            **ExifTool v${{ steps.exiftool_version.outputs.version }}**
            https://exiftool.org
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
