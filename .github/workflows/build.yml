name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Every target builds on a runner of its own architecture. PAR::Packer
        # embeds a native perl interpreter, so ExifTool cannot be cross-packed,
        # and linuxdeploy cannot cross-build ARM AppImages either.
        include:
          - platform: 'macos-latest'
            family: 'mac'
            arch: 'arm64'
          # macos-15-intel is the last x86_64 image GitHub offers and it goes
          # away in August 2027.
          - platform: 'macos-15-intel'
            family: 'mac'
            arch: 'x64'
          - platform: 'ubuntu-24.04'
            family: 'linux'
            arch: 'x64'
          - platform: 'ubuntu-24.04-arm'
            family: 'linux'
            arch: 'arm64'
          - platform: 'windows-latest'
            family: 'win'
            arch: 'x64'

    name: ${{ matrix.family }}-${{ matrix.arch }}
    runs-on: ${{ matrix.platform }}

    env:
      BUNDLE_DIR: src-tauri/target/release/bundle

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable

      - name: Install system dependencies (Linux)
        if: matrix.family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm \
            libpar-packer-perl

      # A bare CPAN client fails to configure PAR::Packer, so bootstrap cpanm.
      - name: Install PAR::Packer (macOS)
        if: matrix.family == 'mac'
        run: |
          curl -fsSL https://cpanmin.us -o /tmp/cpanm
          chmod +x /tmp/cpanm
          /tmp/cpanm -n -l "$HOME/perl5" PAR::Packer
          echo "$HOME/perl5/bin" >> "$GITHUB_PATH"
          echo "PERL5LIB=$HOME/perl5/lib/perl5" >> "$GITHUB_ENV"

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/registry
          key: ${{ matrix.family }}-${{ matrix.arch }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/git
          key: ${{ matrix.family }}-${{ matrix.arch }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src-tauri/target
          key: ${{ matrix.family }}-${{ matrix.arch }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm install

      - name: Pack ExifTool into a self-contained binary
        if: matrix.family != 'win'
        run: node scripts/pack-exiftool.ts

      # The cache above can restore bundles from an earlier version, which would
      # make the rename step ambiguous.
      - name: Clean stale bundles
        run: |
          node -e "require('fs').rmSync(process.env.BUNDLE_DIR, { recursive: true, force: true })"

      - name: Build the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Rename artifacts
        run: node scripts/rename-artifacts.ts ${{ env.BUNDLE_DIR }} ${{ matrix.family }} ${{ matrix.arch }}

      - name: Generate updater JSON
        run: node scripts/generate-updater-json.ts ${{ env.BUNDLE_DIR }} ${{ matrix.family }} ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ matrix.family }}-${{ matrix.arch }}-artifacts
          path: ${{ env.BUNDLE_DIR }}/*/MetadataZero-*-${{ matrix.family }}-${{ matrix.arch }}.*

      - name: Upload latest.json
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: latest-json-${{ matrix.family }}-${{ matrix.arch }}
          path: ${{ env.BUNDLE_DIR }}/latest.json

  flatpak:
    name: flatpak-x64
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpar-packer-perl \
            flatpak \
            flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub org.gnome.Platform//51 org.gnome.Sdk//51

      - name: Install frontend dependencies
        run: npm ci

      # org.gnome.Platform ships no perl, so an unpacked ExifTool cannot start
      # inside the sandbox. This step is what makes the Flatpak work at all.
      - name: Pack ExifTool into a self-contained binary
        run: node scripts/pack-exiftool.ts

      # A plain cargo build would load the frontend from the dev server.
      - name: Build Tauri app
        run: npx tauri build --no-bundle

      - name: Prepare Flatpak resources
        run: |
          mkdir -p flatpak-build/bin
          mkdir -p flatpak-build/lib/MetadataZero/binaries
          mkdir -p flatpak-build/share/applications
          for size in 32 64 128 256; do mkdir -p "flatpak-build/share/icons/hicolor/${size}x${size}/apps"; done
          cp src-tauri/target/release/metadatazero flatpak-build/bin/
          cp src-tauri/binaries/exiftool-x86_64-unknown-linux-gnu flatpak-build/lib/MetadataZero/binaries/
          cp -r src-tauri/binaries/qpdf flatpak-build/lib/MetadataZero/binaries/
          cp flatpak/com.metadatazero.app.desktop flatpak-build/share/applications/
          cp src-tauri/icons/32x32.png flatpak-build/share/icons/hicolor/32x32/apps/com.metadatazero.app.png
          cp src-tauri/icons/64x64.png flatpak-build/share/icons/hicolor/64x64/apps/com.metadatazero.app.png
          cp src-tauri/icons/128x128.png flatpak-build/share/icons/hicolor/128x128/apps/com.metadatazero.app.png
          cp src-tauri/icons/128x128@2x.png flatpak-build/share/icons/hicolor/256x256/apps/com.metadatazero.app.png

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> $GITHUB_OUTPUT

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: flatpak/com.metadatazero.app.yml
          bundle: MetadataZero-${{ steps.version.outputs.version }}-linux-x64.flatpak
          cache-key: flatpak-builder-${{ hashFiles('flatpak/com.metadatazero.app.yml') }}
          # The next step uploads under a stable name the release job can glob.
          upload-artifact: false

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: flatpak-bundle
          path: MetadataZero-${{ steps.version.outputs.version }}-linux-x64.flatpak

  release:
    needs: [build, flatpak]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'

      - name: Get ExifTool version
        id: exiftool_version
        run: |
          VERSION=$(node -e "import('./scripts/exiftool-host.ts').then(m => console.log(m.EXIFTOOL_VERSION))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: artifacts

      - name: Combine updater JSON files
        run: node scripts/combine-updater-json.ts

      - name: Create Release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          files: |
            artifacts/*-artifacts/**/*
            artifacts/flatpak-bundle/*.flatpak
            artifacts/latest.json
          body: |
            #### Bundled ExifTool version

            This release includes:

            **ExifTool v${{ steps.exiftool_version.outputs.version }}**
            https://exiftool.org
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
