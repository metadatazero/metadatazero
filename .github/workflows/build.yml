name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # Every target builds on a runner of its own architecture. PAR::Packer
        # embeds a native perl interpreter, so ExifTool cannot be cross-packed,
        # and linuxdeploy cannot cross-build ARM AppImages either.
        include:
          - platform: 'macos-latest'
            family: 'mac'
            arch: 'arm64'
          # macos-15-intel is the last x86_64 image GitHub offers and it goes
          # away in August 2027.
          - platform: 'macos-15-intel'
            family: 'mac'
            arch: 'x64'
          - platform: 'ubuntu-24.04'
            family: 'linux'
            arch: 'x64'
          - platform: 'ubuntu-24.04-arm'
            family: 'linux'
            arch: 'arm64'
          - platform: 'windows-latest'
            family: 'win'
            arch: 'x64'

    name: ${{ matrix.family }}-${{ matrix.arch }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
      actions: write

    env:
      BUNDLE_DIR: src-tauri/target/release/bundle

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install system dependencies (Linux)
        if: matrix.family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm \
            libpar-packer-perl

      # A bare CPAN client fails to configure PAR::Packer, so bootstrap cpanm.
      - name: Install PAR::Packer (macOS)
        if: matrix.family == 'mac'
        run: |
          curl -fsSL https://cpanmin.us -o /tmp/cpanm
          chmod +x /tmp/cpanm
          /tmp/cpanm -n -l "$HOME/perl5" PAR::Packer
          echo "$HOME/perl5/bin" >> "$GITHUB_PATH"
          echo "PERL5LIB=$HOME/perl5/lib/perl5" >> "$GITHUB_ENV"

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ matrix.family }}-${{ matrix.arch }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ matrix.family }}-${{ matrix.arch }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/target
          key: ${{ matrix.family }}-${{ matrix.arch }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      # The download scripts skip tools that are already in place, so a hit avoids
      # fetching them from GitHub, which drops anonymous downloads when it is busy.
      - name: Restore ExifTool and QPDF
        id: tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/binaries
          key: ${{ matrix.family }}-${{ matrix.arch }}-tools-${{ hashFiles('tools.json', 'scripts/download-exiftool.ts', 'scripts/download-qpdf.ts', 'scripts/pack-exiftool.ts') }}

      - name: Install frontend dependencies
        run: npm install

      - name: Pack ExifTool into a self-contained binary
        if: matrix.family != 'win'
        run: node scripts/pack-exiftool.ts

      # Saved right away rather than at the end of the job, which a failure in
      # another job cancels.
      - name: Save ExifTool and QPDF
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/binaries
          key: ${{ steps.tools.outputs.cache-primary-key }}

      # The cache above can restore bundles from an earlier version, which would
      # make the rename step ambiguous.
      - name: Clean stale bundles
        run: |
          node -e "require('fs').rmSync(process.env.BUNDLE_DIR, { recursive: true, force: true })"

      - name: Build the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Rename artifacts
        run: node scripts/rename-artifacts.ts ${{ env.BUNDLE_DIR }} ${{ matrix.family }} ${{ matrix.arch }}

      - name: Generate updater JSON
        run: node scripts/generate-updater-json.ts ${{ env.BUNDLE_DIR }} ${{ matrix.family }} ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.family }}-${{ matrix.arch }}-artifacts
          path: ${{ env.BUNDLE_DIR }}/*/MetadataZero-*-${{ matrix.family }}-${{ matrix.arch }}.*

      - name: Upload latest.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latest-json-${{ matrix.family }}-${{ matrix.arch }}
          path: ${{ env.BUNDLE_DIR }}/latest.json

      # A release needs every package, so one failure makes the other jobs useless.
      - name: Cancel the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} -R ${{ github.repository }}

  flatpak:
    name: flatpak-x64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpar-packer-perl \
            flatpak \
            flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub org.gnome.Platform//51 org.gnome.Sdk//51

      - name: Restore ExifTool and QPDF
        id: tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/binaries
          key: flatpak-tools-${{ hashFiles('tools.json', 'scripts/download-exiftool.ts', 'scripts/download-qpdf.ts', 'scripts/pack-exiftool.ts') }}

      - name: Install frontend dependencies
        run: npm ci

      # org.gnome.Platform ships no perl, so an unpacked ExifTool cannot start
      # inside the sandbox. This step is what makes the Flatpak work at all.
      - name: Pack ExifTool into a self-contained binary
        run: node scripts/pack-exiftool.ts

      - name: Save ExifTool and QPDF
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/binaries
          key: ${{ steps.tools.outputs.cache-primary-key }}

      # A plain cargo build would load the frontend from the dev server.
      - name: Build Tauri app
        run: npx tauri build --no-bundle

      - name: Prepare Flatpak resources
        run: |
          mkdir -p flatpak-build/bin
          mkdir -p flatpak-build/lib/MetadataZero/binaries
          mkdir -p flatpak-build/share/applications
          for size in 32 64 128 256; do mkdir -p "flatpak-build/share/icons/hicolor/${size}x${size}/apps"; done
          cp src-tauri/target/release/metadatazero flatpak-build/bin/
          cp src-tauri/binaries/exiftool-x86_64-unknown-linux-gnu flatpak-build/lib/MetadataZero/binaries/
          cp -r src-tauri/binaries/qpdf flatpak-build/lib/MetadataZero/binaries/
          cp flatpak/com.metadatazero.app.desktop flatpak-build/share/applications/
          cp src-tauri/icons/32x32.png flatpak-build/share/icons/hicolor/32x32/apps/com.metadatazero.app.png
          cp src-tauri/icons/64x64.png flatpak-build/share/icons/hicolor/64x64/apps/com.metadatazero.app.png
          cp src-tauri/icons/128x128.png flatpak-build/share/icons/hicolor/128x128/apps/com.metadatazero.app.png
          cp src-tauri/icons/128x128@2x.png flatpak-build/share/icons/hicolor/256x256/apps/com.metadatazero.app.png

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> $GITHUB_OUTPUT

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: flatpak/com.metadatazero.app.yml
          bundle: MetadataZero-${{ steps.version.outputs.version }}-linux-x64.flatpak
          cache-key: flatpak-builder-${{ hashFiles('flatpak/com.metadatazero.app.yml') }}
          # The next step uploads under a stable name the release job can glob.
          upload-artifact: false

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-bundle
          path: MetadataZero-${{ steps.version.outputs.version }}-linux-x64.flatpak

      - name: Cancel the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} -R ${{ github.repository }}

  release:
    needs: [build, flatpak]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Get ExifTool version
        id: exiftool_version
        run: |
          VERSION=$(node -e "import('./scripts/exiftool-host.ts').then(m => console.log(m.EXIFTOOL_VERSION))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Combine updater JSON files
        run: node scripts/combine-updater-json.ts

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            artifacts/*-artifacts/**/*
            artifacts/flatpak-bundle/*.flatpak
            artifacts/latest.json
          body: |
            #### Bundled ExifTool version

            This release includes:

            **ExifTool v${{ steps.exiftool_version.outputs.version }}**
            https://exiftool.org
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
